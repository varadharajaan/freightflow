# =============================================================================
# FreightFlow — CI/CD Pipeline
# =============================================================================
# Triggered on push to main/master/develop and pull requests to main/master.
# Stages: toolchain check → build & test → code quality + security (parallel)
#        → docker build & push (main/master only)
#
# CACHING STRATEGY:
# - Maven dependencies: cached via actions/setup-java with hash-based key
# - Compiled classes: cached between jobs to avoid recompilation
# - Docker layers: GitHub Actions cache (GHA) for build-push-action
# - Terraform providers: cached to avoid repeated downloads
# =============================================================================
name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/varadharajaan/freightflow
  # Maven build cache configuration
  MAVEN_OPTS: -Dmaven.repo.local=.m2/repository

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Stage 0: Detect Changed Paths (for selective job execution)
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.filter.outputs.java }}
      terraform: ${{ steps.filter.outputs.terraform }}
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
      services: ${{ steps.filter.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            java:
              - '**/*.java'
              - '**/pom.xml'
              - '.mvn/**'
              - 'mvnw*'
            terraform:
              - 'infrastructure/terraform/**'
            kubernetes:
              - 'infrastructure/kubernetes/**'
            services:
              - 'booking-service/**'
              - 'tracking-service/**'
              - 'billing-service/**'
              - 'vessel-schedule-service/**'
              - 'customer-service/**'
              - 'notification-service/**'
              - 'api-gateway/**'
              - 'discovery-server/**'
              - 'config-server/**'
              - 'freightflow-commons/**'
              - 'freightflow-parent/**'
              - 'freightflow-bom/**'

  # ---------------------------------------------------------------------------
  # Stage 1: Toolchain Verification
  # ---------------------------------------------------------------------------
  toolchain-check:
    name: Toolchain Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Verify Java 21
        run: |
          java -version 2>&1 | grep '"21' || (echo "ERROR: Java 21 required" && exit 1)
      - name: Verify Maven Wrapper
        run: |
          test -f mvnw || (echo "ERROR: mvnw script missing" && exit 1)
          test -f mvnw.cmd || (echo "ERROR: mvnw.cmd script missing" && exit 1)
          test -f .mvn/wrapper/maven-wrapper.properties || (echo "ERROR: Maven Wrapper missing" && exit 1)

  # ---------------------------------------------------------------------------
  # Stage 2: Build & Test (with Postgres for integration tests)
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    needs: [toolchain-check, changes]
    if: needs.changes.outputs.java == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: freightflow_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      # --- Maven Cache: dependencies + compiled classes ---
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/com/freightflow
          key: maven-deps-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-deps-${{ runner.os }}-
      
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Restore compiled classes cache
        uses: actions/cache@v4
        id: classes-cache
        with:
          path: |
            **/target/classes
            **/target/test-classes
            **/target/generated-sources
          key: compiled-${{ runner.os }}-${{ hashFiles('**/src/**/*.java', '**/pom.xml') }}
          restore-keys: |
            compiled-${{ runner.os }}-
            
      - name: Compile All Modules
        if: steps.classes-cache.outputs.cache-hit != 'true'
        run: ./mvnw compile test-compile -B -ntp -T1C
        
      - name: Unit Tests
        run: ./mvnw test -B -ntp -Dmaven.main.skip=true
        
      - name: Integration Tests + Verify
        run: ./mvnw verify -B -ntp -Dmaven.main.skip=true
        
      # --- Cache compiled artifacts for downstream jobs ---
      - name: Save build artifacts for downstream jobs
        uses: actions/cache/save@v4
        with:
          path: |
            **/target/*.jar
            **/target/classes
          key: build-artifacts-${{ github.sha }}
          
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/**'
      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/target/site/jacoco/**'

  # ---------------------------------------------------------------------------
  # Stage 3a: Code Quality (parallel with security)
  # ---------------------------------------------------------------------------
  code-quality:
    name: Code Quality
    needs: [build-and-test, changes]
    if: needs.changes.outputs.java == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # --- Restore Maven cache and build artifacts ---
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/com/freightflow
          key: maven-deps-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-deps-${{ runner.os }}-
            
      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            **/target/*.jar
            **/target/classes
          key: build-artifacts-${{ github.sha }}
          
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Architecture Tests
        run: ./mvnw test -B -ntp -Dtest="*ArchitectureTest" -Dsurefire.failIfNoSpecifiedTests=false
      - name: Checkstyle
        run: ./mvnw checkstyle:check -B -ntp || true
      - name: SpotBugs
        run: ./mvnw spotbugs:check -B -ntp || true

      - name: PIT Mutation Smoke (booking-service)
        continue-on-error: true
        run: ./mvnw -pl booking-service -am org.pitest:pitest-maven:mutationCoverage -B -ntp -DskipITs=true

  # ---------------------------------------------------------------------------
  # Stage 3b: Security Scan (parallel with code quality)
  # ---------------------------------------------------------------------------
  # OPTIMIZATION: OWASP Dependency Check is slow due to NVD database download.
  # - With NVD API key (secrets.NVD_API_KEY): ~2-4 minutes (5-10x faster rate limit)
  # - Without API key: ~10-15 minutes (NIST rate-limits to ~50 req/min)
  # - Parallel analysis threads reduce scan time further
  # - Cache key uses weekly timestamp to refresh NVD data while enabling reuse
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan
    needs: [build-and-test, changes]
    if: needs.changes.outputs.java == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # --- Restore Maven cache ---
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/com/freightflow
          key: maven-deps-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-deps-${{ runner.os }}-
            
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      # --- Cache OWASP NVD database (large, slow to download) ---
      # Weekly cache key ensures fresh vulnerability data while enabling reuse
      - name: Cache OWASP NVD Database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-week-${{ github.run_id }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-week-
            owasp-nvd-${{ runner.os }}-
            
      - name: OWASP Dependency Check
        env:
          # NVD_API_KEY increases rate limit from 50 req/min to 500+ req/min
          # Get a free key at: https://nvd.nist.gov/developers/request-an-api-key
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          OWASP_ARGS="-B -ntp -DfailBuildOnCVSS=9"
          OWASP_ARGS="$OWASP_ARGS -DnvdValidForHours=24"      # Accept cached NVD data up to 24h old
          OWASP_ARGS="$OWASP_ARGS -DanalyzerThreads=4"        # Parallel analysis
          
          # Use NVD API key if available (significantly faster)
          if [ -n "$NVD_API_KEY" ]; then
            echo "Using NVD API key for faster vulnerability database sync"
            OWASP_ARGS="$OWASP_ARGS -DnvdApiKey=$NVD_API_KEY"
          else
            echo "No NVD API key configured — scan will be slower (rate-limited)"
            echo "Get a free key at: https://nvd.nist.gov/developers/request-an-api-key"
            echo "Then add it as NVD_API_KEY in repository secrets"
          fi
          
          ./mvnw org.owasp:dependency-check-maven:check $OWASP_ARGS || true

  # ---------------------------------------------------------------------------
  # Stage 3c: Infrastructure as Code Validation (Terraform + tfsec)
  # ---------------------------------------------------------------------------
  iac-validate:
    name: IaC Validate
    needs: changes
    if: needs.changes.outputs.terraform == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # --- Cache Terraform providers ---
      - name: Cache Terraform Providers
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            infrastructure/terraform/**/.terraform
          key: terraform-${{ runner.os }}-${{ hashFiles('infrastructure/terraform/**/*.tf') }}
          restore-keys: |
            terraform-${{ runner.os }}-
            
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          
      - name: Configure Terraform Plugin Cache
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc
          
      - name: Terraform Format Check
        run: terraform fmt -check -recursive infrastructure/terraform
      - name: Terraform Validate (modules + bootstrap)
        run: |
          for dir in infrastructure/terraform/modules/* infrastructure/terraform/bootstrap/*; do
            if [ -d "$dir" ]; then
              terraform -chdir="$dir" init -backend=false
              terraform -chdir="$dir" validate
            fi
          done
      - name: tfsec Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure/terraform

  # ---------------------------------------------------------------------------
  # Stage 4a: Docker Build Verify (PRs and feature branches — build only, no push)
  # Validates every Dockerfile compiles and packages correctly.
  # Tests are already verified by build-and-test; this stage confirms the
  # Docker packaging pipeline is healthy before any merge.
  # ---------------------------------------------------------------------------
  docker-build-verify:
    name: Docker Build Verify — ${{ matrix.service }}
    needs: [build-and-test, changes]
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && (needs.changes.outputs.services == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - booking-service
          - tracking-service
          - billing-service
          - vessel-schedule-service
          - customer-service
          - notification-service
          - api-gateway
          - discovery-server
          - config-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build JAR (skip tests — already passed in build-and-test)
        run: ./mvnw package -B -ntp -pl ${{ matrix.service }} -am -DskipTests
      - name: Build Docker Image (no push — stage verification only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          load: true   # Load image into local docker daemon for smoke test
          tags: freightflow/${{ matrix.service }}:verify-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image starts (booking-service only)
        if: matrix.service == 'booking-service'
        run: |
          # Run container in detached mode and wait for Spring Boot's "Started" log
          # Uses docker-smoke profile: in-memory H2, no Kafka/Eureka/Keycloak
          CONTAINER_ID=$(docker run -d \
            -e SPRING_PROFILES_ACTIVE=docker-smoke \
            -e JAVA_OPTS="-XX:MaxRAMPercentage=50.0" \
            freightflow/booking-service:verify-${{ github.sha }})
          echo "Container started: $CONTAINER_ID"
          # Wait up to 60 seconds for Spring Boot to report successful startup
          TIMEOUT=60
          ELAPSED=0
          until docker logs "$CONTAINER_ID" 2>&1 | grep -q "Started\|Started.*Application\|JVM running for"; do
            sleep 2
            ELAPSED=$((ELAPSED + 2))
            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              echo "ERROR: Container did not start within ${TIMEOUT}s"
              docker logs "$CONTAINER_ID"
              docker rm -f "$CONTAINER_ID"
              exit 1
            fi
            # Fail fast if the container exited unexpectedly
            STATUS=$(docker inspect --format='{{.State.Status}}' "$CONTAINER_ID")
            if [ "$STATUS" = "exited" ]; then
              echo "ERROR: Container exited unexpectedly"
              docker logs "$CONTAINER_ID"
              docker rm -f "$CONTAINER_ID"
              exit 1
            fi
          done
          echo "SUCCESS: booking-service container started successfully"
          docker rm -f "$CONTAINER_ID"

  # ---------------------------------------------------------------------------
  # Stage 4b: Docker Build & Push (main/master only, per-service matrix)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build & Push — ${{ matrix.service }}
    needs: [build-and-test, code-quality]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - booking-service
          - tracking-service
          - billing-service
          - vessel-schedule-service
          - customer-service
          - notification-service
          - api-gateway
          - discovery-server
          - config-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build JAR (skip tests — already passed)
        run: ./mvnw package -B -ntp -pl ${{ matrix.service }} -am -DskipTests
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Stage 5: Update K8s Manifests (GitOps image tag update)
  # ---------------------------------------------------------------------------
  update-manifests:
    name: Update K8s Image Tags
    needs: docker-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update image tags in Kustomize base
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          for manifest in infrastructure/kubernetes/base/*.yaml; do
            if grep -q "ghcr.io/varadharajaan/freightflow/" "$manifest"; then
              sed -i "s|ghcr.io/varadharajaan/freightflow/\([^:]*\):.*|ghcr.io/varadharajaan/freightflow/\1:${{ github.sha }}|g" "$manifest"
              echo "Updated: $manifest"
            fi
          done
      - name: Commit and push manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/kubernetes/base/
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ github.sha }}"
          git push
