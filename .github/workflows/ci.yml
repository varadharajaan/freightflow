# =============================================================================
# FreightFlow — CI/CD Pipeline
# =============================================================================
# Triggered on push to main/master/develop and pull requests to main/master.
# Stages: toolchain check → build & test → code quality + security (parallel)
#        → docker build & push (main/master only)
# =============================================================================
name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/varadharajaan/freightflow

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Toolchain Verification
  # ---------------------------------------------------------------------------
  toolchain-check:
    name: Toolchain Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Verify Java 21
        run: |
          java -version 2>&1 | grep '"21' || (echo "ERROR: Java 21 required" && exit 1)
      - name: Verify Maven Wrapper
        run: |
          test -f mvnw || (echo "ERROR: mvnw script missing" && exit 1)
          test -f mvnw.cmd || (echo "ERROR: mvnw.cmd script missing" && exit 1)
          test -f .mvn/wrapper/maven-wrapper.properties || (echo "ERROR: Maven Wrapper missing" && exit 1)

  # ---------------------------------------------------------------------------
  # Stage 2: Build & Test (with Postgres for integration tests)
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    needs: toolchain-check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: freightflow_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile All Modules
        run: ./mvnw compile -B -ntp -T1C
      - name: Unit Tests
        run: ./mvnw test -B -ntp
      - name: Integration Tests + Verify
        run: ./mvnw verify -B -ntp
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/**'
      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/target/site/jacoco/**'

  # ---------------------------------------------------------------------------
  # Stage 3a: Code Quality (parallel with security)
  # ---------------------------------------------------------------------------
  code-quality:
    name: Code Quality
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Architecture Tests
        run: ./mvnw test -B -ntp -Dtest="*ArchitectureTest" -Dsurefire.failIfNoSpecifiedTests=false
      - name: Checkstyle
        run: ./mvnw checkstyle:check -B -ntp || true
      - name: SpotBugs
        run: ./mvnw spotbugs:check -B -ntp || true

      - name: PIT Mutation Smoke (booking-service)
        continue-on-error: true
        run: ./mvnw -pl booking-service org.pitest:pitest-maven:mutationCoverage -B -ntp -DskipITs=true

  # ---------------------------------------------------------------------------
  # Stage 3b: Security Scan (parallel with code quality)
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: OWASP Dependency Check
        run: ./mvnw org.owasp:dependency-check-maven:check -B -ntp -DfailBuildOnCVSS=9 || true

  # ---------------------------------------------------------------------------
  # Stage 3c: Infrastructure as Code Validation (Terraform + tfsec)
  # ---------------------------------------------------------------------------
  iac-validate:
    name: IaC Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Terraform Format Check
        run: terraform fmt -check -recursive infrastructure/terraform
      - name: Terraform Validate (modules + bootstrap)
        run: |
          for dir in infrastructure/terraform/modules/* infrastructure/terraform/bootstrap/*; do
            if [ -d "$dir" ]; then
              terraform -chdir="$dir" init -backend=false
              terraform -chdir="$dir" validate
            fi
          done
      - name: tfsec Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure/terraform

  # ---------------------------------------------------------------------------
  # Stage 4: Docker Build & Push (main/master only, per-service matrix)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build & Push — ${{ matrix.service }}
    needs: [build-and-test, code-quality]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - booking-service
          - tracking-service
          - billing-service
          - vessel-schedule-service
          - customer-service
          - notification-service
          - api-gateway
          - discovery-server
          - config-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build JAR (skip tests — already passed)
        run: ./mvnw package -B -ntp -pl ${{ matrix.service }} -am -DskipTests
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Stage 5: Update K8s Manifests (GitOps image tag update)
  # ---------------------------------------------------------------------------
  update-manifests:
    name: Update K8s Image Tags
    needs: docker-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update image tags in Kustomize base
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          for manifest in infrastructure/kubernetes/base/*.yaml; do
            if grep -q "ghcr.io/varadharajaan/freightflow/" "$manifest"; then
              sed -i "s|ghcr.io/varadharajaan/freightflow/\([^:]*\):.*|ghcr.io/varadharajaan/freightflow/\1:${{ github.sha }}|g" "$manifest"
              echo "Updated: $manifest"
            fi
          done
      - name: Commit and push manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/kubernetes/base/
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ github.sha }}"
          git push
