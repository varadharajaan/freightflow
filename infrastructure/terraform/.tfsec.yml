# tfsec configuration for FreightFlow infrastructure
# Most issues are addressed inline with #tfsec:ignore annotations in .tf files.
# This file provides additional severity overrides and global exclusions.

severity_overrides:
  aws-s3-enable-bucket-logging: INFO
  aws-rds-enable-performance-insights: INFO

# Global check exclusions (checks handled with inline #tfsec:ignore annotations)
exclude:
  - aws-s3-enable-bucket-logging

soft_fail: false
