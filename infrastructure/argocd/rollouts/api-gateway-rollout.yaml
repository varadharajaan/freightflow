# =============================================================================
# FreightFlow API Gateway — Argo Rollout (Canary)
# =============================================================================
# Pod template mirrors infrastructure/kubernetes/base/api-gateway.yaml.
# Port: 8080
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-gateway
  namespace: freightflow
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: freightflow
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: freightflow
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: api-gateway
      containers:
        - name: api-gateway
          image: ghcr.io/varadharajaan/freightflow/api-gateway:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: EUREKA_HOST
              value: "discovery-server"
            - name: KEYCLOAK_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: keycloak-config
                  key: issuer-uri
            - name: CONFIG_SERVER_URL
              value: "http://config:config@config-server:8888"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
  strategy:
    canary:
      canaryService: api-gateway-canary
      stableService: api-gateway-stable
      trafficRouting:
        istio:
          virtualServices:
            - name: api-gateway-vs
              routes:
                - primary
      steps:
        - setWeight: 10
        - pause: {duration: 2m}
        - setWeight: 30
        - pause: {duration: 2m}
        - setWeight: 60
        - pause: {duration: 2m}
        - setWeight: 100
      analysis:
        templates:
          - templateName: success-rate
          - templateName: latency-check
        startingStep: 2
        args:
          - name: service-name
            value: api-gateway
          - name: namespace
            value: freightflow
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-stable
  namespace: freightflow
  labels:
    app: api-gateway
    role: stable
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-canary
  namespace: freightflow
  labels:
    app: api-gateway
    role: canary
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-gateway-vs
  namespace: freightflow
spec:
  hosts:
    - api-gateway
  http:
    - name: primary
      route:
        - destination:
            host: api-gateway-stable
            port:
              number: 8080
          weight: 100
        - destination:
            host: api-gateway-canary
            port:
              number: 8080
          weight: 0
