# =============================================================================
# FreightFlow Customer Service — Argo Rollout (Canary)
# =============================================================================
# Pod template mirrors infrastructure/kubernetes/base/customer-service.yaml.
# Port: 8085
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: customer-service
  namespace: freightflow
  labels:
    app: customer-service
    app.kubernetes.io/name: customer-service
    app.kubernetes.io/part-of: freightflow
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
        app.kubernetes.io/name: customer-service
        app.kubernetes.io/part-of: freightflow
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: freightflow
      containers:
        - name: customer-service
          image: ghcr.io/varadharajaan/freightflow/customer-service:latest
          ports:
            - containerPort: 8085
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: customer-db-credentials
                  key: url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: customer-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: customer-db-credentials
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: bootstrap-servers
            - name: EUREKA_HOST
              value: "discovery-server"
            - name: KEYCLOAK_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: keycloak-config
                  key: issuer-uri
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger-collector:4318/v1/traces"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
  strategy:
    canary:
      canaryService: customer-service-canary
      stableService: customer-service-stable
      trafficRouting:
        istio:
          virtualServices:
            - name: customer-service-vs
              routes:
                - primary
      steps:
        - setWeight: 10
        - pause: {duration: 2m}
        - setWeight: 30
        - pause: {duration: 2m}
        - setWeight: 60
        - pause: {duration: 2m}
        - setWeight: 100
      analysis:
        templates:
          - templateName: success-rate
          - templateName: latency-check
        startingStep: 2
        args:
          - name: service-name
            value: customer-service
          - name: namespace
            value: freightflow
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service-stable
  namespace: freightflow
  labels:
    app: customer-service
    role: stable
spec:
  selector:
    app: customer-service
  ports:
    - port: 8085
      targetPort: 8085
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service-canary
  namespace: freightflow
  labels:
    app: customer-service
    role: canary
spec:
  selector:
    app: customer-service
  ports:
    - port: 8085
      targetPort: 8085
      name: http
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: customer-service-vs
  namespace: freightflow
spec:
  hosts:
    - customer-service
  http:
    - name: primary
      route:
        - destination:
            host: customer-service-stable
            port:
              number: 8085
          weight: 100
        - destination:
            host: customer-service-canary
            port:
              number: 8085
          weight: 0
