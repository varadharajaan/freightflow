# =============================================================================
# FreightFlow Config Server — ArgoCD Application
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-server
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: freightflow
    app.kubernetes.io/component: config-server
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: freightflow
  source:
    repoURL: https://github.com/varadharajaan/freightflow.git
    targetRevision: main
    path: infrastructure/kubernetes/base
    kustomize:
      namePrefix: ""
  destination:
    server: https://kubernetes.default.svc
    namespace: freightflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
