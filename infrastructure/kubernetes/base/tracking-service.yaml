# =============================================================================
# FreightFlow Tracking Service — Kubernetes Manifests
# =============================================================================
# Deployment + Service + HPA + PDB
# Port: 8082 (matches application.yml server.port)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-service
  namespace: freightflow
  labels:
    app: tracking-service
    app.kubernetes.io/name: tracking-service
    app.kubernetes.io/part-of: freightflow
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tracking-service
  template:
    metadata:
      labels:
        app: tracking-service
        app.kubernetes.io/name: tracking-service
        app.kubernetes.io/part-of: freightflow
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: tracking-service
      containers:
        - name: tracking-service
          image: ghcr.io/varadharajaan/freightflow/tracking-service:latest
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: tracking-db-credentials
                  key: url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tracking-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tracking-db-credentials
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: bootstrap-servers
            - name: EUREKA_HOST
              value: "discovery-server"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger-collector:4318/v1/traces"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: tracking-service
  namespace: freightflow
  labels:
    app: tracking-service
    app.kubernetes.io/name: tracking-service
    app.kubernetes.io/part-of: freightflow
spec:
  selector:
    app: tracking-service
  ports:
    - port: 8082
      targetPort: 8082
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tracking-service-hpa
  namespace: freightflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tracking-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tracking-service-pdb
  namespace: freightflow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: tracking-service
