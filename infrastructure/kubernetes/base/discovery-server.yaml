# =============================================================================
# FreightFlow Discovery Server (Eureka) — Kubernetes Manifests
# =============================================================================
# Deployment + Service
# Port: 8761 (matches application.yml server.port)
# Single replica — Eureka server does not register itself
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: freightflow
  labels:
    app: discovery-server
    app.kubernetes.io/name: discovery-server
    app.kubernetes.io/part-of: freightflow
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
        app.kubernetes.io/name: discovery-server
        app.kubernetes.io/part-of: freightflow
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8761"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: discovery-server
      containers:
        - name: discovery-server
          image: ghcr.io/varadharajaan/freightflow/discovery-server:latest
          ports:
            - containerPort: 8761
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: freightflow
  labels:
    app: discovery-server
    app.kubernetes.io/name: discovery-server
    app.kubernetes.io/part-of: freightflow
spec:
  selector:
    app: discovery-server
  ports:
    - port: 8761
      targetPort: 8761
      name: http
