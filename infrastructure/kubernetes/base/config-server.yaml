# =============================================================================
# FreightFlow Config Server — Kubernetes Manifests
# =============================================================================
# Deployment + Service
# Port: 8888 (matches application.yml server.port)
# Single replica — centralized configuration server
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: freightflow
  labels:
    app: config-server
    app.kubernetes.io/name: config-server
    app.kubernetes.io/part-of: freightflow
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
        app.kubernetes.io/name: config-server
        app.kubernetes.io/part-of: freightflow
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: freightflow
      containers:
        - name: config-server
          image: ghcr.io/varadharajaan/freightflow/config-server:latest
          ports:
            - containerPort: 8888
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: EUREKA_HOST
              value: "discovery-server"
            - name: SPRING_CLOUD_CONFIG_SERVER_GIT_URI
              valueFrom:
                configMapKeyRef:
                  name: config-server-settings
                  key: git-uri
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: freightflow
  labels:
    app: config-server
    app.kubernetes.io/name: config-server
    app.kubernetes.io/part-of: freightflow
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
      name: http
