        - source:
            principals:
              - "cluster.local/ns/freightflow/sa/billing-service"
---
# All platform services can read config and register with discovery.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-services-to-discovery
  namespace: freightflow
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: discovery-server
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/freightflow/sa/api-gateway"
              - "cluster.local/ns/freightflow/sa/booking-service"
              - "cluster.local/ns/freightflow/sa/tracking-service"
              - "cluster.local/ns/freightflow/sa/billing-service"
              - "cluster.local/ns/freightflow/sa/vessel-schedule-service"
              - "cluster.local/ns/freightflow/sa/customer-service"
              - "cluster.local/ns/freightflow/sa/notification-service"
              - "cluster.local/ns/freightflow/sa/config-server"
              - "cluster.local/ns/freightflow/sa/discovery-server"
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-services-to-config
  namespace: freightflow
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: config-server
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/freightflow/sa/api-gateway"
              - "cluster.local/ns/freightflow/sa/booking-service"
              - "cluster.local/ns/freightflow/sa/tracking-service"
              - "cluster.local/ns/freightflow/sa/billing-service"
              - "cluster.local/ns/freightflow/sa/vessel-schedule-service"
              - "cluster.local/ns/freightflow/sa/customer-service"
              - "cluster.local/ns/freightflow/sa/notification-service"
              - "cluster.local/ns/freightflow/sa/config-server"
              - "cluster.local/ns/freightflow/sa/discovery-server"
---
# Prometheus scraping from the monitoring namespace for actuator endpoints.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: freightflow
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - "monitoring"
      to:
        - operation:
            methods: ["GET"]
            paths: ["/actuator/prometheus", "/actuator/health", "/actuator/health/*"]
