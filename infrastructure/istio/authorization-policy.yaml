# Default deny all traffic in freightflow namespace.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: freightflow
spec: {}
---
# External ingress traffic is allowed only via the ingress gateway service account.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-api-gateway
  namespace: freightflow
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: api-gateway
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
---
# api-gateway can route requests to business services.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-api-gateway-to-booking
  namespace: freightflow
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: booking-service
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/freightflow/sa/api-gateway"
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-api-gateway-to-tracking
  namespace: freightflow
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: tracking-service
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/freightflow/sa/api-gateway"
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-api-gateway-to-billing
  namespace: freightflow
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: billing-service
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/freightflow/sa/api-gateway"
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-api-gateway-to-vessel
  namespace: freightflow
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: vessel-schedule-service
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/freightflow/sa/api-gateway"
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-api-gateway-to-customer
  namespace: freightflow
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: customer-service
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/freightflow/sa/api-gateway"
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-api-gateway-to-notification
  namespace: freightflow
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: notification-service
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/freightflow/sa/api-gateway"
---
# Explicit east-west calls between internal services.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-booking-to-vessel
  namespace: freightflow
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: vessel-schedule-service
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/freightflow/sa/booking-service"
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-booking-to-customer
  namespace: freightflow
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: customer-service
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/freightflow/sa/booking-service"
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-billing-to-customer
  namespace: freightflow
spec:
  action: ALLOW
  selector:
