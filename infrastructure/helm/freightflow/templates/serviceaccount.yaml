{{/*
=============================================================================
FreightFlow — Helm ServiceAccount Template
=============================================================================
Creates one ServiceAccount per enabled service by default.
You can override per service with services.<name>.serviceAccountName.
=============================================================================
*/}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default $name $svc.serviceAccountName }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: freightflow
    app.kubernetes.io/managed-by: helm
{{- end }}
{{- end }}
