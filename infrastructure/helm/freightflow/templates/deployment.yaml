{{/*
=============================================================================
FreightFlow — Helm Deployment Template
=============================================================================
Iterates over .Values.services to generate a Deployment for each enabled
service. Ports, resources, and environment variables are parameterized.
=============================================================================
*/}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: freightflow
    app.kubernetes.io/managed-by: helm
    version: v1
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: freightflow
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $svc.port }}"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: {{ $.Values.global.serviceAccountName }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $name }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ $svc.springProfile | quote }}
            - name: EUREKA_HOST
              value: "discovery-server"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ $.Values.kafka.bootstrapServers | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.tracing.endpoint | quote }}
            {{- if $svc.database }}
            {{- if $svc.database.enabled }}
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $svc.database.secretName }}
                  key: url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $svc.database.secretName }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $svc.database.secretName }}
                  key: password
            {{- end }}
            {{- end }}
            {{- if or (eq $name "api-gateway") (eq $name "booking-service") (eq $name "customer-service") }}
            - name: KEYCLOAK_ISSUER_URI
              value: {{ $.Values.keycloak.issuerUri | quote }}
            {{- end }}
            {{- if eq $name "api-gateway" }}
            - name: CONFIG_SERVER_URL
              value: {{ $.Values.configServer.url | quote }}
            {{- end }}
          resources:
            requests:
              cpu: {{ $svc.resources.requests.cpu | quote }}
              memory: {{ $svc.resources.requests.memory | quote }}
            limits:
              cpu: {{ $svc.resources.limits.cpu | quote }}
              memory: {{ $svc.resources.limits.memory | quote }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ $svc.port }}
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ $svc.port }}
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
{{- end }}
{{- end }}
