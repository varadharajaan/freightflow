{{/*
=============================================================================
FreightFlow — Helm Service Template
=============================================================================
Generates a Kubernetes Service for each enabled FreightFlow service.
Service port and targetPort match the container port from values.yaml.
=============================================================================
*/}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: freightflow
    app.kubernetes.io/managed-by: helm
spec:
  selector:
    app: {{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      name: http
{{- end }}
{{- end }}
